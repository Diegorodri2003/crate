<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crate</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#8f8f8c; --card:#d7d6d3; --panel:#cfcecb; --panel-2:#c9c8c4; --panel-3:#dcdbd8;
    --field:#e6e5e2; --border:rgba(0,0,0,.12); --border-soft:rgba(0,0,0,.08);
    --text:#15140f; --text-2:#1d1c1a; --muted:#57564f; --muted-2:#77766f; --muted-3:#8d8c85;
    --accent:#d4561c; --accent-hover:#c04c14; --accent-ink:#fff;
    --good:#4f9a6a; --bad:#b3261e; --bad-bg:#f3e3e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.4 Archivo,system-ui,sans-serif;}
  h1,h2{margin:0;}
  a{color:var(--accent);}
  a:hover{color:var(--accent-hover);}
  button{
    font:500 13px/1 Archivo,sans-serif; background:var(--panel-2); color:var(--text-2);
    border:1px solid var(--border); border-radius:8px; padding:9px 14px; cursor:pointer;
  }
  button:hover{background:#c0bfbb;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  button.primary:hover{background:var(--accent-hover);}
  button.danger{background:var(--bad); color:#fff; border-color:var(--bad);}
  button.ghost{background:transparent;}
  input[type=text], input[type=number]{
    font:14px Archivo,sans-serif; background:var(--field); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:8px 10px;
  }
  label.field-label{display:block; font:600 12px Archivo,sans-serif; color:var(--muted-3); margin-bottom:6px;}
  .chip{
    display:inline-flex; align-items:center; gap:5px; font:500 12px "JetBrains Mono",monospace;
    background:var(--panel-2); border:1px solid var(--border); border-radius:999px;
    padding:6px 11px; cursor:pointer; user-select:none; color:var(--muted);
  }
  .chip.active{border-color:var(--accent); color:var(--accent); background:#f3ddd0;}
  .chip.reason{cursor:default; color:var(--muted-2); font-size:11px;}
  .mono{font-family:"JetBrains Mono",monospace;}
  .muted{color:var(--muted-2); font-size:13px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  #banner{
    display:none; background:#f3ddd0; color:var(--accent-hover); border-bottom:2px solid var(--accent);
    padding:10px 20px; font:600 13px Archivo,sans-serif;
  }
  #errors{
    position:fixed; top:14px; right:14px; z-index:999; display:flex;
    flex-direction:column; gap:8px; max-width:calc(100vw - 28px); width:360px;
  }
  .toast{
    background:var(--bad-bg); border:1px solid var(--bad); color:var(--bad);
    padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }

  /* one narrow, vertical column -- the whole page reads top to bottom */
  .wrap{max-width:480px; margin:0 auto; padding:24px 24px 110px;}
  .card{
    background:var(--card); border-radius:14px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.14);
  }
  .titlebar{
    height:32px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 12px; gap:6px;
  }
  .titlebar .dots{display:flex; gap:6px;}
  .titlebar .dot{width:10px; height:10px; border-radius:50%; background:#bdbcb9; border:1px solid rgba(0,0,0,.14);}
  .titlebar .name{flex:1; text-align:center; font:500 11.5px Archivo,sans-serif; color:var(--muted); letter-spacing:.02em; margin-right:32px;}

  .topbar{padding:14px 16px 0; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .mark{width:22px; height:22px; border-radius:5px; background:var(--text-2); display:grid; place-items:center;}
  .brand .mark span{width:9px; height:9px; border:2px solid #e9e8e5; border-radius:2px; transform:rotate(45deg);}
  .brand .word{font:800 13px/1 Archivo,sans-serif; letter-spacing:.14em; color:var(--text-2);}

  #library-btn{display:flex; align-items:center; gap:7px; max-width:190px; padding:5px 9px;}
  #library-btn .status-dot{width:5px; height:5px; border-radius:50%; background:var(--good); flex:none;}
  #library-btn .path{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:500 11px "JetBrains Mono",monospace;}

  /* rail (Fit + Rescan) sits beside the Place circle, exactly like the brief */
  .toprow{padding:12px 16px 0; display:flex; gap:12px; align-items:stretch;}
  .rail{display:flex; flex-direction:column; gap:8px; width:60px; flex:none; padding-top:44px;}
  .rail button{width:60px; height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:0;}
  .rail #scan-btn .icon{width:15px; height:15px; border:2px solid currentColor; border-radius:50%; border-top-color:transparent; transform:rotate(45deg);}
  .rail .label{font:600 8.5px "JetBrains Mono",monospace; letter-spacing:.04em; text-align:center; line-height:1.15;}
  .rail .status{font:400 9px/1.3 "JetBrains Mono",monospace; color:var(--muted-2); text-align:center;}
  .rail .status.needs{color:var(--accent-hover); cursor:pointer; text-decoration:underline;}
  .dot-icon{width:13px; height:13px; border-radius:50%; background:var(--panel-3); box-shadow:0 0 0 2px rgba(0,0,0,.12) inset;}
  #fit-track-btn.active{background:var(--accent); color:#fff;}
  #fit-track-btn.active .dot-icon{background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.25);}

  .place-col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;}
  .place-zone{
    flex:none; width:186px; height:186px; border-radius:50%; position:relative;
    display:grid; place-items:center; cursor:copy; padding:0;
    background:radial-gradient(circle at 50% 50%,var(--panel) 0%,var(--panel-2) 70%,#c2c1bd 100%);
    border:2px dashed rgba(0,0,0,.2); margin:0 auto;
  }
  .place-zone.drag{border-color:var(--accent); border-style:solid; box-shadow:0 0 0 8px rgba(212,86,28,.14);}
  .place-zone.loaded{border-color:var(--good); border-style:solid;}
  .place-zone .ring{position:absolute; inset:9px; border-radius:50%; border:1px dashed rgba(0,0,0,.18);}
  .place-zone .disc{
    position:absolute; inset:24px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fbfbfa 0%,#e4e3e0 42%,#c8c7c3 72%,#b3b2ae 100%);
    box-shadow:inset 0 2px 6px rgba(255,255,255,.9), 0 8px 18px rgba(0,0,0,.16);
    animation:drift 26s linear infinite;
  }
  .place-zone.spinning .disc{animation-duration:2.4s;}
  @keyframes drift{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  .place-zone .content{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none;}
  .place-zone .tri{width:0; height:0; border-left:17px solid var(--accent); border-top:11px solid transparent; border-bottom:11px solid transparent; margin-left:6px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));}
  .place-zone .label{font:600 9.5px "JetBrains Mono",monospace; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; text-align:center; max-width:130px;}
  .place-hint{margin-top:9px; font:400 10.5px "JetBrains Mono",monospace; color:var(--muted-2); text-align:center; max-width:220px;}

  .key-row{padding:10px 16px 0; display:flex; justify-content:flex-end;}
  .key-select{
    font:600 11.5px Archivo,sans-serif; letter-spacing:.05em; color:var(--text-2);
    background:var(--panel-2); border:1px solid var(--border); border-radius:7px;
    padding:8px 30px 8px 12px; cursor:pointer;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" fill="none" stroke="%2382817a" stroke-width="1.5"/></svg>');
    background-repeat:no-repeat; background-position:right 11px center;
  }
  .key-select:hover{background-color:#c0bfbb;}

  .search-row{padding:12px 16px 0; display:flex; gap:10px; align-items:stretch;}
  .search-box{
    flex:1; min-width:0; background:var(--field); border:1px solid var(--border-soft);
    border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:150px;
  }
  #search-text{
    flex:1; border:0; outline:0; resize:none; background:transparent;
    font:800 18px/1.28 Archivo,sans-serif; color:var(--text); width:100%;
  }
  #search-text::placeholder{color:var(--muted-3); font-weight:600;}
  .search-tools{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  #find-btn{
    width:88px; flex:none; padding:14px 11px; display:flex; flex-direction:column;
    justify-content:space-between; align-items:flex-start; gap:16px;
  }
  #find-btn .t{font:800 14px/1.08 Archivo,sans-serif; color:#fff; text-align:left;}
  #find-btn .arrow{font:400 20px/1 "JetBrains Mono",monospace; color:#fff; align-self:flex-end;}

  .filters{padding:10px 16px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .filters label.muted{display:flex; align-items:center; gap:6px;}
  .filters input[type=number]{width:60px;}

  #results{margin-top:14px; border-top:1px solid var(--border); background:var(--panel); padding:10px 16px 14px; max-height:300px; overflow:auto;}
  .results-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .results-title{font:600 10px "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  .results-meta{font:400 10.5px "JetBrains Mono",monospace; color:var(--muted-2);}
  .hit-row{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    background:var(--panel-3); border:1px solid var(--border-soft); border-radius:8px;
    padding:8px 9px; margin-bottom:5px; font:inherit; cursor:pointer;
  }
  .hit-row:hover{background:#e3e2df;}
  .hit-row .play{width:24px; height:24px; flex:none; border-radius:5px; background:var(--text-2); display:grid; place-items:center; padding:0; border:0;}
  .hit-row .play .tri{width:0; height:0; border-left:7px solid #e9e8e5; border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; margin-left:2px;}
  .hit-row .info{flex:1; min-width:0;}
  .hit-row .name{font:600 11.5px "JetBrains Mono",monospace; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hit-row .meta{font:400 10px "JetBrains Mono",monospace; color:var(--muted-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hit-row .bar{width:44px; height:5px; border-radius:3px; background:rgba(0,0,0,.12); flex:none; overflow:hidden;}
  .hit-row .bar > span{display:block; height:100%; background:var(--accent);}
  .hit-row .score{font:600 10.5px "JetBrains Mono",monospace; color:var(--accent-hover); width:32px; text-align:right; flex:none;}
  #results .empty{padding:14px 4px; color:var(--muted-2); font-size:13px;}

  .plan-drawer{border-top:1px solid var(--border);}
  .plan-drawer-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    padding:12px 16px; background:var(--panel);
  }
  .plan-drawer-head h2{font:600 11px "JetBrains Mono",monospace; letter-spacing:.06em; color:var(--muted); text-transform:uppercase;}
  .plan-actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  #plan-body{display:none; padding:0 16px 16px;}
  #plan-body.open{display:block;}
  #plan-list{max-height:320px; overflow:auto; border:1px solid var(--border-soft); border-radius:8px; margin-top:6px;}
  .plan-row{
    display:flex; flex-direction:column; gap:3px;
    padding:9px 11px; border-bottom:1px solid var(--border-soft); font-size:11.5px;
  }
  .plan-row.head{display:none;}
  .plan-row.err{background:var(--bad-bg);}
  .plan-row .old{color:var(--bad); text-decoration:line-through; word-break:break-all;}
  .plan-row .reason{color:var(--muted-2); font-size:10.5px;}
  .plan-row .new{color:var(--good); word-break:break-all;}

  #player-bar{
    position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; z-index:50; pointer-events:none;
  }
  #player-bar .inner{
    pointer-events:auto; width:100%; max-width:432px; margin:0 12px 12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 14px; display:flex; align-items:center; gap:12px; font-size:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  #player-bar .muted{flex:0 0 auto;}
  #player-bar audio{flex:1 1 auto; height:32px;}

  @media (max-width:420px){
    .toprow{flex-direction:column; align-items:center;}
    .rail{flex-direction:row; width:auto; padding-top:0;}
  }
</style>
</head>
<body>

<div id="banner" role="status"></div>
<div id="errors" aria-live="polite"></div>

<div class="wrap">
<div class="card">

  <div class="titlebar">
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="name">Crate / Librarian</div>
  </div>

  <div class="topbar">
    <div class="brand">
      <div class="mark"><span></span></div>
      <div class="word">CRATE</div>
    </div>
    <button id="library-btn" title="Click to change the folder Rescan/Place use">
      <span class="status-dot"></span>
      <span class="path" id="library-path-label">messy</span>
      <span class="muted" aria-hidden="true">▾</span>
    </button>
  </div>

  <div class="toprow">
    <div class="rail">
      <button id="fit-track-btn" title="Upload a bounce of your track and rank samples against it">
        <span class="dot-icon" aria-hidden="true"></span>
        <span class="label">FIT<br>TRACK</span>
      </button>
      <button id="scan-btn" class="primary" title="Scan the library folder and rebuild the search index">
        <span class="icon" aria-hidden="true"></span>
        <span class="label">RESCAN<br>FOLDERS</span>
      </button>
      <div class="status" id="rail-status">idle</div>
    </div>

    <div class="place-col">
      <button id="place-zone" class="place-zone" aria-label="Drop a sample or a whole folder here, or click to choose files, to label them and file them into the right folder">
        <div class="ring"></div>
        <div class="disc"></div>
        <div class="content">
          <div class="tri" aria-hidden="true"></div>
          <div class="label" id="place-zone-label">drop samples<br>or a folder</div>
        </div>
      </button>
      <div class="place-hint" id="place-hint">or click to choose files</div>
    </div>
    <input type="file" id="place-file-input" hidden accept="audio/*" multiple>
    <input type="file" id="fit-file-input" hidden accept="audio/*">
  </div>

  <div class="key-row">
    <select id="key-select" class="key-select" title="Filter by key" aria-label="Filter by key"></select>
  </div>

  <div class="search-row">
    <div class="search-box">
      <label class="field-label" for="search-text">What sample are you after?</label>
      <textarea id="search-text" placeholder="dark punchy kick, vinyl dust, 90 bpm" maxlength="140"></textarea>
      <div class="search-tools">
        <button id="search-clear" class="ghost">✕ clear</button>
        <span class="muted" id="chars-left">140 left</span>
      </div>
    </div>
    <button id="find-btn" class="primary">
      <span class="t">FIND<br>SAMPLES</span>
      <span class="arrow" aria-hidden="true">↳</span>
    </button>
  </div>

  <div class="filters">
    <div class="row" id="family-chips"></div>
    <div class="row" id="type-chips"></div>
    <label class="muted">BPM <input type="number" id="bpm-min" placeholder="min"></label>
    <label class="muted">to <input type="number" id="bpm-max" placeholder="max"></label>
  </div>

  <div id="results">
    <div class="results-head">
      <div class="results-title" id="results-title">closest matches</div>
      <div class="row" id="contrast-row" style="display:none;">
        <button id="contrast-toggle" class="chip" aria-pressed="false">Contrast: OFF</button>
      </div>
      <div class="results-meta" id="results-meta"></div>
    </div>
    <div id="results-list"></div>
  </div>

  <div class="plan-drawer">
    <div class="plan-drawer-head">
      <h2>Reorganise plan</h2>
      <div class="plan-actions">
        <span class="muted" id="plan-status">no plan yet — rescan first</span>
      </div>
    </div>
    <div class="plan-drawer-head" style="padding-top:0;">
      <button id="plan-toggle-btn" class="ghost" aria-expanded="false" aria-controls="plan-body">View diff</button>
      <div class="plan-actions">
        <button id="apply-btn" disabled>Apply</button>
        <button id="undo-btn" class="danger" style="display:none;">Undo</button>
      </div>
    </div>
    <div id="plan-body">
      <div id="plan-list" class="mono"></div>
    </div>
  </div>

</div>
</div>

<div id="player-bar">
  <div class="inner">
    <span class="muted">Playing: <span id="now-playing">—</span></span>
    <audio id="player" controls></audio>
  </div>
</div>

<script>
(function(){
  "use strict";

  const FAMILIES = ["Drums","Bass","Acoustic","Synth","Vocal","FX","unsorted"];
  const KEYS = [null, "C", "Am", "F", "Dm", "G", "Em"];
  const player = document.getElementById("player");
  const nowPlaying = document.getElementById("now-playing");

  // ---------------------------------------------------------------------
  // error toasts — every fetch goes through here, nothing fails silently
  // ---------------------------------------------------------------------
  function showError(msg){
    const box = document.getElementById("errors");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), 8000);
  }

  async function api(method, url, body){
    try{
      const opts = { method };
      if (body !== undefined){
        if (body instanceof FormData){
          opts.body = body;
        } else {
          opts.headers = { "Content-Type": "application/json" };
          opts.body = JSON.stringify(body);
        }
      }
      const res = await fetch(url, opts);
      let data = null;
      try { data = await res.json(); } catch(e) { /* no body */ }
      if (!res.ok) throw new Error((data && data.error) || (res.status + " " + res.statusText));
      if (data && data.error) throw new Error(data.error);
      return data;
    } catch(err){
      showError(method + " " + url + " — " + err.message);
      throw err;
    }
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }

  function reasonChips(reasons){
    return (reasons || []).map(r => `<span class="chip reason">${esc(r)}</span>`).join(" ");
  }

  function playAudio(path, label){
    try{
      player.src = "/api/audio?path=" + encodeURIComponent(path || "");
      nowPlaying.textContent = label || path || "";
      player.play().catch(err => showError("playback failed — " + err.message));
    } catch(err){
      showError("playback failed — " + err.message);
    }
  }
  player.addEventListener("error", () => showError("audio element could not load /api/audio"));

  // ---------------------------------------------------------------------
  // status banner
  // ---------------------------------------------------------------------
  async function loadStatus(){
    try{
      const s = await api("GET", "/api/status");
      const banner = document.getElementById("banner");
      const degraded = s.degraded || [];
      if (s.missing && s.missing.length){
        banner.style.display = "block";
        banner.textContent = "DEMO MODE (fixtures) — not live yet: " + s.missing.join(", ");
      } else if (s.use_fixtures){
        banner.style.display = "block";
        banner.textContent = "DEMO MODE — USE_FIXTURES is on.";
      } else if (degraded.length){
        banner.style.display = "block";
        banner.textContent = "DEGRADED — running on FIXTURES, not real analysis: " + degraded.join(", ");
      } else {
        banner.style.display = "none";
      }
    } catch(e){ /* already toasted */ }
  }

  // ---------------------------------------------------------------------
  // library path — drives Scan's root AND where Place files new drops
  // ---------------------------------------------------------------------
  let scanRoot = "messy";
  const libraryLabel = document.getElementById("library-path-label");

  function shortenPath(p){
    const parts = p.split(/[\\/]/).filter(Boolean);
    return parts.slice(-2).join("/") || p;
  }
  function renderLibraryLabel(){
    libraryLabel.textContent = shortenPath(scanRoot);
    document.getElementById("library-btn").title = scanRoot + " — click to change the folder Rescan/Place use";
  }
  function useNewRoot(path){
    scanRoot = path;
    renderLibraryLabel();
    setRailStatus("needs-rescan", "folder changed — rescan");
  }
  function promptForRoot(){
    const next = window.prompt("Library folder (used by Rescan and by dropping a sample):", scanRoot);
    if (next && next.trim()) useNewRoot(next.trim());
  }
  document.getElementById("library-btn").addEventListener("click", async () => {
    let data;
    try { data = await api("POST", "/api/browse-folder", { initial: scanRoot }); }
    catch(e){ promptForRoot(); return; } // server-side picker errored -- fall back to typing a path
    if (data.available === false){ promptForRoot(); return; }
    if (data.path) useNewRoot(data.path);
  });
  renderLibraryLabel();

  // ---------------------------------------------------------------------
  // rail status (shared by scan + plan)
  // ---------------------------------------------------------------------
  const railStatusEl = document.getElementById("rail-status");
  function setRailStatus(kind, text){
    railStatusEl.textContent = text;
    railStatusEl.className = "status" + (kind === "needs-rescan" ? " needs" : "");
  }
  railStatusEl.addEventListener("click", () => {
    if (railStatusEl.classList.contains("needs")) startScan();
  });

  // ---------------------------------------------------------------------
  // SCAN + auto PLAN
  // ---------------------------------------------------------------------
  let scanPoll = null;
  let lastPlans = [];

  async function startScan(){
    clearInterval(scanPoll);
    setRailStatus("scanning", "scan 0%");
    let data;
    try { data = await api("POST", "/api/scan", { root: scanRoot }); }
    catch(e){ setRailStatus("idle", "idle"); return; }
    const jobId = data.job_id;
    scanPoll = setInterval(async () => {
      let s;
      try { s = await api("GET", "/api/scan/" + jobId); }
      catch(e){ clearInterval(scanPoll); setRailStatus("idle", "idle"); return; }
      const total = s.total || 0;
      const done = (s.records || []).length;
      const pct = total ? Math.round((done / total) * 100) : (s.done ? 100 : 0);
      if (!s.done){
        setRailStatus("scanning", "scan " + pct + "%");
      } else {
        clearInterval(scanPoll);
        loadStatus();
        await buildPlan();
        runSearch();
      }
    }, 250);
  }
  document.getElementById("scan-btn").addEventListener("click", startScan);

  // ---------------------------------------------------------------------
  // PLAN / APPLY / UNDO — kept fully visible; applying moves real files
  // ---------------------------------------------------------------------
  let lastUndoLog = null;
  const planBody = document.getElementById("plan-body");
  const planToggleBtn = document.getElementById("plan-toggle-btn");

  function renderPlan(plans){
    const list = document.getElementById("plan-list");
    list.innerHTML = "";
    if (!plans.length){
      list.innerHTML = '<div class="plan-row"><span class="muted">nothing to move</span></div>';
    }
    plans.forEach(p => {
      const row = document.createElement("div");
      row.className = "plan-row" + (/quarantined/i.test(p.reason || "") ? " err" : "");
      row.innerHTML =
        `<div class="old">${esc(p.old_path)}</div>` +
        `<div class="reason">${esc(p.reason)}</div>` +
        `<div class="new">→ ${esc(p.new_path)}</div>`;
      list.appendChild(row);
    });
    document.getElementById("apply-btn").disabled = plans.length === 0;
  }

  async function buildPlan(){
    document.getElementById("plan-status").textContent = "building plan…";
    let data;
    try { data = await api("POST", "/api/plan", {}); }
    catch(e){
      document.getElementById("plan-status").textContent = "plan failed";
      setRailStatus("idle", "idle");
      return;
    }
    lastPlans = data.plans || [];
    renderPlan(lastPlans);
    document.getElementById("plan-status").textContent = lastPlans.length + " moves proposed · dry run";
    setRailStatus("idle", lastPlans.length ? "plan ready" : "idle");
  }

  planToggleBtn.addEventListener("click", () => {
    const open = planBody.classList.toggle("open");
    planToggleBtn.textContent = open ? "Hide diff" : "View diff";
    planToggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  async function applyPlan(){
    document.getElementById("plan-status").textContent = "applying…";
    let data;
    try { data = await api("POST", "/api/apply", { dry_run: false }); }
    catch(e){ document.getElementById("plan-status").textContent = "apply failed"; return; }
    lastUndoLog = data.undo_log;
    document.getElementById("plan-status").textContent = "applied — " + data.moved + " moved";
    document.getElementById("apply-btn").disabled = true;
    document.getElementById("undo-btn").style.display = "inline-block";
  }

  async function undoPlan(){
    document.getElementById("plan-status").textContent = "undoing…";
    let data;
    try { data = await api("POST", "/api/undo", { log: lastUndoLog }); }
    catch(e){ document.getElementById("plan-status").textContent = "undo failed"; return; }
    document.getElementById("plan-status").textContent = "restored " + data.restored + " files";
    document.getElementById("undo-btn").style.display = "none";
    document.getElementById("apply-btn").disabled = false;
  }

  document.getElementById("apply-btn").addEventListener("click", () => {
    if (window.confirm("Move " + lastPlans.length + " files on disk now? This is not a dry run.")) applyPlan();
  });
  document.getElementById("undo-btn").addEventListener("click", undoPlan);

  // ---------------------------------------------------------------------
  // SEARCH
  // ---------------------------------------------------------------------
  let activeFamily = null;
  let activeType = null; // "oneshot" | "loop" | null
  let activeKeyIdx = 0;

  function buildChips(){
    const fam = document.getElementById("family-chips");
    fam.innerHTML = FAMILIES.map(f => `<button type="button" class="chip" data-family="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("");
    fam.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      const f = chip.dataset.family;
      activeFamily = (activeFamily === f) ? null : f;
      fam.querySelectorAll(".chip").forEach(c => {
        const on = c.dataset.family === activeFamily;
        c.classList.toggle("active", on);
        c.setAttribute("aria-pressed", on ? "true" : "false");
      });
      runSearch();
    }));

    const type = document.getElementById("type-chips");
    type.innerHTML = ["oneshot", "loop"].map(t => `<button type="button" class="chip" data-type="${t}" aria-pressed="false">${t}</button>`).join("");
    type.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      const t = chip.dataset.type;
      activeType = (activeType === t) ? null : t;
      type.querySelectorAll(".chip").forEach(c => {
        const on = c.dataset.type === activeType;
        c.classList.toggle("active", on);
        c.setAttribute("aria-pressed", on ? "true" : "false");
      });
      runSearch();
    }));
  }

  const keySelect = document.getElementById("key-select");
  keySelect.innerHTML = KEYS.map((k, i) => `<option value="${i}">${k ? esc(k.toUpperCase()) : "ANY KEY"}</option>`).join("");
  function renderKey(){
    keySelect.value = String(activeKeyIdx);
  }
  keySelect.addEventListener("change", () => {
    activeKeyIdx = Number(keySelect.value) || 0;
    runSearch();
  });
  renderKey();

  function renderHits(container, hits, titleText){
    document.getElementById("results-title").textContent = titleText;
    document.getElementById("results-meta").textContent = hits.length + " results";
    container.innerHTML = "";
    if (!hits.length){
      container.innerHTML = '<div class="empty">no results</div>';
      return;
    }
    hits.forEach(h => {
      const r = h.record || {};
      const row = document.createElement("button");
      row.type = "button";
      row.className = "hit-row";
      row.innerHTML =
        `<span class="play" aria-hidden="true"><span class="tri"></span></span>` +
        `<span class="info">` +
          `<span class="name">${esc(r.filename)}</span><br>` +
          `<span class="meta">${esc(r.family)} / ${esc(r.instrument)} · ${r.bpm ? esc(r.bpm) + " BPM" : "—"} · ${esc(r.key || "—")}</span>` +
        `</span>` +
        `<span class="bar"><span style="width:${Math.round((h.score||0)*100)}%"></span></span>` +
        `<span class="score">${Math.round((h.score||0)*100)}%</span>`;
      row.title = "play " + (r.filename || "");
      row.addEventListener("click", () => playAudio(r.path, r.filename));
      container.appendChild(row);
      if (h.reasons && h.reasons.length){
        const reasons = document.createElement("div");
        reasons.style.margin = "-3px 0 6px 42px";
        reasons.innerHTML = reasonChips(h.reasons);
        container.appendChild(reasons);
      }
    });
  }

  async function runSearch(){
    if (fitFile) return; // Fit Track owns the results panel while a reference is loaded
    const body = {
      text: document.getElementById("search-text").value.trim() || null,
      family: activeFamily,
      sample_type: activeType,
      key: KEYS[activeKeyIdx],
      bpm_min: numOrNull(document.getElementById("bpm-min").value),
      bpm_max: numOrNull(document.getElementById("bpm-max").value),
      limit: 50,
    };
    let data;
    try { data = await api("POST", "/api/search", body); } catch(e){ return; }
    renderHits(document.getElementById("results-list"), data.hits || [], "closest matches");
    loadStatus();
  }

  function numOrNull(v){ return (v === "" || v === null || v === undefined) ? null : Number(v); }

  document.getElementById("find-btn").addEventListener("click", runSearch);
  document.getElementById("search-text").addEventListener("input", () => {
    document.getElementById("chars-left").textContent = (140 - document.getElementById("search-text").value.length) + " left";
  });
  document.getElementById("search-text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); runSearch(); } });
  document.getElementById("bpm-min").addEventListener("change", runSearch);
  document.getElementById("bpm-max").addEventListener("change", runSearch);
  document.getElementById("search-clear").addEventListener("click", () => {
    activeFamily = null; activeType = null; activeKeyIdx = 0;
    document.getElementById("search-text").value = "";
    document.getElementById("chars-left").textContent = "140 left";
    document.getElementById("bpm-min").value = "";
    document.getElementById("bpm-max").value = "";
    document.querySelectorAll("#family-chips .chip, #type-chips .chip").forEach(c => { c.classList.remove("active"); c.setAttribute("aria-pressed","false"); });
    renderKey();
    clearFit();
    runSearch();
  });

  // ---------------------------------------------------------------------
  // FIT TRACK (rail button) — upload a bounce, rank the library against it
  // ---------------------------------------------------------------------
  let fitFile = null;
  let contrastOn = false;

  const fitTrackBtn = document.getElementById("fit-track-btn");
  const fitInput = document.getElementById("fit-file-input");
  const contrastRow = document.getElementById("contrast-row");

  function renderFitTrackBtn(){
    fitTrackBtn.classList.toggle("active", !!fitFile);
    fitTrackBtn.title = fitFile
      ? "fitting to " + fitFile.name + " — click to clear"
      : "Upload a bounce of your track and rank samples against it";
  }

  fitTrackBtn.addEventListener("click", () => {
    if (fitFile){ clearFit(); return; }
    fitInput.click();
  });
  fitInput.addEventListener("change", () => {
    if (fitInput.files[0]){ fitFile = fitInput.files[0]; renderFitTrackBtn(); doFit(); }
    fitInput.value = "";
  });

  function clearFit(){
    fitFile = null;
    renderFitTrackBtn();
    contrastRow.style.display = "none";
    runSearch();
  }

  document.getElementById("contrast-toggle").addEventListener("click", (e) => {
    contrastOn = !contrastOn;
    e.currentTarget.textContent = "Contrast: " + (contrastOn ? "ON" : "OFF");
    e.currentTarget.classList.toggle("active", contrastOn);
    e.currentTarget.setAttribute("aria-pressed", contrastOn ? "true" : "false");
    if (fitFile) doFit();
  });

  async function doFit(){
    if (!fitFile) return;
    contrastRow.style.display = "flex";
    document.getElementById("results-title").textContent = "ranked against your track";
    document.getElementById("results-list").innerHTML = '<div class="empty">analysing…</div>';
    const form = new FormData();
    form.append("file", fitFile, fitFile.name);
    form.append("contrast", contrastOn ? "true" : "false");
    let data;
    try { data = await api("POST", "/api/fit?contrast=" + contrastOn, form); }
    catch(e){ return; }
    renderHits(document.getElementById("results-list"), data.hits || [], "ranked against your track");
  }

  // ---------------------------------------------------------------------
  // PLACE — the central circle: drop one or many samples, or a whole
  // folder, and get each one labelled and filed straight into
  // {family}/{instrument}/... under the library root. One request per
  // file to /api/place, run in sequence.
  // ---------------------------------------------------------------------
  const placeZone = document.getElementById("place-zone");
  const placeInput = document.getElementById("place-file-input");
  const placeLabel = document.getElementById("place-zone-label");
  const placeHint = document.getElementById("place-hint");
  const PLACE_AUDIO_EXT = /\.(wav|aiff|aif|flac|mp3|ogg|m4a)$/i;

  function renderPlaceIdle(){
    placeZone.classList.remove("loaded");
    placeLabel.innerHTML = "drop samples<br>or a folder";
    placeHint.textContent = "or click to choose files";
  }

  // Folders don't come through dataTransfer.files -- they come through
  // dataTransfer.items as directory entries that have to be walked by hand.
  function readAllEntries(reader){
    return new Promise((resolve, reject) => {
      const all = [];
      (function readBatch(){
        reader.readEntries(entries => {
          if (!entries.length){ resolve(all); return; }
          all.push(...entries);
          readBatch();
        }, reject);
      })();
    });
  }
  async function collectFilesFromEntry(entry, out){
    if (!entry) return;
    if (entry.isFile){
      await new Promise((resolve, reject) => entry.file(f => { out.push(f); resolve(); }, reject));
    } else if (entry.isDirectory){
      const entries = await readAllEntries(entry.createReader());
      for (const child of entries) await collectFilesFromEntry(child, out);
    }
  }
  async function collectDroppedFiles(dataTransfer){
    const items = dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry){
      const entries = [];
      for (let i = 0; i < items.length; i++){
        const entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      const out = [];
      for (const entry of entries) await collectFilesFromEntry(entry, out);
      return out;
    }
    return Array.from(dataTransfer.files || []);
  }

  ["dragenter", "dragover"].forEach(ev => placeZone.addEventListener(ev, e => {
    e.preventDefault(); placeZone.classList.add("drag");
  }));
  ["dragleave", "drop"].forEach(ev => placeZone.addEventListener(ev, e => {
    e.preventDefault(); placeZone.classList.remove("drag");
  }));
  placeZone.addEventListener("drop", async e => {
    const files = (await collectDroppedFiles(e.dataTransfer)).filter(f => PLACE_AUDIO_EXT.test(f.name));
    if (files.length) doPlaceBatch(files);
  });
  placeZone.addEventListener("click", () => placeInput.click());
  placeInput.addEventListener("change", () => {
    const files = Array.from(placeInput.files || []).filter(f => PLACE_AUDIO_EXT.test(f.name));
    if (files.length) doPlaceBatch(files);
    placeInput.value = "";
  });

  async function placeOne(file){
    const form = new FormData();
    form.append("file", file, file.name);
    form.append("root", scanRoot);
    try { return await api("POST", "/api/place", form); }
    catch(e){ return { error: true }; }
  }

  async function doPlaceBatch(files){
    if (!files.length) return;
    placeZone.classList.add("spinning");
    placeZone.classList.remove("loaded");
    const results = [];
    for (let i = 0; i < files.length; i++){
      placeLabel.innerHTML = "filing…";
      placeHint.textContent = files.length > 1
        ? ("sample " + (i + 1) + " / " + files.length)
        : files[0].name;
      results.push(await placeOne(files[i]));
    }
    placeZone.classList.remove("spinning");

    const ok = results.filter(r => r && !r.error);
    const failed = results.length - ok.length;

    if (files.length === 1 && ok.length === 1){
      const data = ok[0];
      placeZone.classList.add("loaded");
      placeLabel.innerHTML = esc(data.family) + "<br>" + esc(data.instrument);
      placeHint.textContent = "→ " + data.new_path_relative;
    } else if (ok.length === 0){
      renderPlaceIdle();
    } else {
      const unsorted = ok.filter(r => r.family === "unsorted").length;
      placeZone.classList.add("loaded");
      placeLabel.innerHTML = ok.length + " / " + results.length + "<br>filed";
      const bits = [];
      if (unsorted) bits.push(unsorted + " → unsorted");
      if (failed) bits.push(failed + " failed");
      placeHint.textContent = bits.length ? bits.join(" · ") : "all labelled";
    }
    setTimeout(renderPlaceIdle, 6000);
    runSearch(); // it's indexed now -- show it if it matches the current query
  }

  // ---------------------------------------------------------------------
  buildChips();
  loadStatus();
  renderFitTrackBtn();
  renderPlaceIdle();
  runSearch();
})();
</script>
</body>
</html>
