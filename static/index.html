<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crate</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel-2:#1b2027; --border:#2b323b;
    --text:#f3f5f7; --muted:#9aa5b1; --accent:#ffb454; --accent-2:#4fd1c5;
    --bad:#ff6b6b; --good:#57e389;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  h1,h2,h3{margin:0 0 8px;}
  h1{font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);}
  h2{font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  button{
    font:600 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:10px 16px; cursor:pointer;
  }
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:var(--accent); color:#1a1200; border-color:var(--accent);}
  button.danger{background:var(--bad); color:#200; border-color:var(--bad);}
  input[type=text], input[type=number]{
    font-size:15px; background:var(--panel-2); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:9px 10px;
  }
  input:focus{outline:2px solid var(--accent-2);}
  .chip{
    display:inline-flex; align-items:center; gap:4px; font-size:14px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; cursor:pointer; user-select:none; color:var(--muted);
  }
  .chip.active{border-color:var(--accent-2); color:var(--accent-2); background:#132a29;}
  .chip.reason{cursor:default; color:var(--muted); font-size:13.5px;}
  #banner{
    display:none; background:#3a2a10; color:var(--accent); border-bottom:2px solid var(--accent);
    padding:10px 20px; font-size:15px; font-weight:600;
  }
  #errors{
    position:fixed; top:12px; right:12px; z-index:999; display:flex;
    flex-direction:column; gap:8px; max-width:420px;
  }
  .toast{
    background:#2a1010; border:1px solid var(--bad); color:#ffd7d7;
    padding:10px 14px; border-radius:8px; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  main.grid{
    display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:auto;
    gap:16px; padding:16px 16px 120px;
  }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px 18px; min-width:0;
  }
  .panel-scan{grid-column:1; grid-row:1;}
  .panel-search{grid-column:2; grid-row:1;}
  .panel-plan{
    grid-column:1 / span 2; grid-row:2; border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
  }
  .panel-fit{grid-column:1 / span 2; grid-row:3;}
  @media (max-width:900px){
    main.grid{grid-template-columns:1fr;}
    .panel-scan,.panel-search,.panel-plan,.panel-fit{grid-column:1;}
    .panel-scan{grid-row:1;} .panel-search{grid-row:2;} .panel-plan{grid-row:3;} .panel-fit{grid-row:4;}
  }
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .row + .row{margin-top:10px;}
  progress{width:100%; height:20px; accent-color:var(--accent);}
  .muted{color:var(--muted); font-size:14px;}
  .mono{font-family:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}

  /* PLAN — the centerpiece */
  #plan-list{max-height:520px; overflow:auto; margin-top:12px; border-radius:8px;}
  .plan-row{
    display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:16px; align-items:center;
    padding:12px 14px; border-bottom:1px solid var(--border); font-size:15px;
  }
  .plan-row.err{background:#2a1a10; border-left:4px solid var(--bad);}
  .plan-row .old{color:var(--bad); text-decoration:line-through; word-break:break-all;}
  .plan-row .reason{color:var(--muted); font-size:14px;}
  .plan-row .new{color:var(--good); word-break:break-all;}
  .plan-head{font-weight:700; color:var(--muted); text-transform:uppercase; font-size:12.5px; letter-spacing:.06em; border-bottom:2px solid var(--border);}

  /* SEARCH results */
  #search-results .hit-row, #fit-results .hit-row{
    display:flex; align-items:center; gap:12px; padding:10px 8px;
    border-bottom:1px solid var(--border); font-size:14.5px; flex-wrap:wrap;
  }
  .hit-name{font-weight:600; min-width:140px; word-break:break-all;}
  .hit-meta{color:var(--muted); min-width:150px;}
  .play-btn{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; padding:0; flex:0 0 auto;
  }
  .score-bar{width:60px; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; flex:0 0 auto;}
  .score-bar > span{display:block; height:100%; background:var(--accent-2);}

  /* FIT drop zone */
  #drop-zone{
    border:3px dashed var(--border); border-radius:10px; padding:30px;
    text-align:center; font-size:18px; color:var(--muted); cursor:pointer;
    transition:.15s;
  }
  #drop-zone.drag{border-color:var(--accent-2); color:var(--accent-2); background:#0f1a1a;}

  /* now-playing bar */
  #player-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--panel-2);
    border-top:2px solid var(--border); padding:10px 16px; display:flex;
    align-items:center; gap:14px; font-size:14.5px; z-index:50;
  }
  #player-bar .muted{flex:0 0 auto;}
  #player-bar audio{flex:1 1 auto; max-width:520px;}
</style>
</head>
<body>

<div id="banner"></div>
<div id="errors"></div>

<main class="grid">

  <!-- 1. SCAN -->
  <section class="panel panel-scan">
    <h1>crate</h1>
    <h2>1 · Scan</h2>
    <div class="row">
      <input type="text" id="scan-root" placeholder="/path/to/messy/folder" style="flex:1;" value="~/Samples/messy">
      <button class="primary" id="scan-btn">Scan</button>
    </div>
    <div class="row">
      <progress id="scan-progress" value="0" max="1"></progress>
    </div>
    <div class="row">
      <span class="muted" id="scan-count">0 / 0</span>
    </div>
  </section>

  <!-- 3. SEARCH -->
  <section class="panel panel-search">
    <h2>3 · Search</h2>
    <div class="row">
      <input type="text" id="search-text" placeholder="search filename, family, descriptors…" style="flex:1;">
      <button id="search-btn">Search</button>
    </div>
    <div class="row" id="family-chips"></div>
    <div class="row" id="type-chips"></div>
    <div class="row">
      <label class="muted">BPM <input type="number" id="bpm-min" placeholder="min" style="width:70px;"></label>
      <label class="muted">to <input type="number" id="bpm-max" placeholder="max" style="width:70px;"></label>
      <button id="search-clear">Clear filters</button>
    </div>
    <div id="search-results" style="margin-top:10px; max-height:260px; overflow:auto;"></div>
  </section>

  <!-- 2. PLAN (centerpiece) -->
  <section class="panel panel-plan">
    <div class="row" style="justify-content:space-between;">
      <h2 style="margin:0;">2 · Plan — the rename diff</h2>
      <div class="row">
        <button id="plan-btn" class="primary">Build Plan</button>
        <button id="apply-btn" disabled>Apply</button>
        <button id="undo-btn" class="danger" style="display:none;">UNDO</button>
        <span class="muted" id="plan-status"></span>
      </div>
    </div>
    <div id="plan-list" class="mono">
      <div class="plan-row plan-head"><div>Old name</div><div>Reason</div><div>New path</div></div>
    </div>
  </section>

  <!-- 4. FIT -->
  <section class="panel panel-fit">
    <div class="row" style="justify-content:space-between;">
      <h2 style="margin:0;">4 · Fit — match a bounce</h2>
      <label class="chip" id="contrast-toggle">Contrast: OFF</label>
    </div>
    <div id="drop-zone">drop a bounce of your track<br><span class="muted" style="font-size:14px;">(or click to choose a file)</span></div>
    <input type="file" id="fit-file-input" hidden>
    <div id="fit-results" style="margin-top:12px; max-height:260px; overflow:auto;"></div>
  </section>

</main>

<div id="player-bar">
  <span class="muted">Now playing: <span id="now-playing">—</span></span>
  <audio id="player" controls></audio>
</div>

<script>
(function(){
  "use strict";

  const FAMILIES = ["Drums","Bass","Acoustic","Synth","Vocal","FX","unsorted"];
  const player = document.getElementById("player");
  const nowPlaying = document.getElementById("now-playing");

  // ---------------------------------------------------------------------
  // error toasts — every fetch goes through here, nothing fails silently
  // ---------------------------------------------------------------------
  function showError(msg){
    const box = document.getElementById("errors");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => el.remove(), 8000);
  }

  async function api(method, url, body){
    try{
      const opts = { method };
      if (body !== undefined){
        if (body instanceof FormData){
          opts.body = body;
        } else {
          opts.headers = { "Content-Type": "application/json" };
          opts.body = JSON.stringify(body);
        }
      }
      const res = await fetch(url, opts);
      let data = null;
      try { data = await res.json(); } catch(e) { /* no body */ }
      if (!res.ok) throw new Error((data && data.error) || (res.status + " " + res.statusText));
      if (data && data.error) throw new Error(data.error);
      return data;
    } catch(err){
      showError(method + " " + url + " — " + err.message);
      throw err;
    }
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }

  function reasonChips(reasons){
    return (reasons || []).map(r => `<span class="chip reason">${esc(r)}</span>`).join(" ");
  }

  function playAudio(path, label){
    try{
      player.src = "/api/audio?path=" + encodeURIComponent(path || "");
      nowPlaying.textContent = label || path || "";
      player.play().catch(err => showError("playback failed — " + err.message));
    } catch(err){
      showError("playback failed — " + err.message);
    }
  }
  player.addEventListener("error", () => showError("audio element could not load /api/audio"));

  // ---------------------------------------------------------------------
  // status banner
  // ---------------------------------------------------------------------
  async function loadStatus(){
    try{
      const s = await api("GET", "/api/status");
      const banner = document.getElementById("banner");
      if (s.missing && s.missing.length){
        banner.style.display = "block";
        banner.textContent = "DEMO MODE (fixtures) — not live yet: " + s.missing.join(", ");
      } else if (s.use_fixtures){
        banner.style.display = "block";
        banner.textContent = "DEMO MODE — USE_FIXTURES is on.";
      }
    } catch(e){ /* already toasted */ }
  }

  // ---------------------------------------------------------------------
  // 1. SCAN
  // ---------------------------------------------------------------------
  let scanPoll = null;

  async function startScan(){
    clearInterval(scanPoll);
    const root = document.getElementById("scan-root").value.trim();
    document.getElementById("scan-progress").value = 0;
    document.getElementById("scan-count").textContent = "0 / 0";
    let data;
    try { data = await api("POST", "/api/scan", { root }); } catch(e){ return; }
    const jobId = data.job_id;
    scanPoll = setInterval(async () => {
      let s;
      try { s = await api("GET", "/api/scan/" + jobId); } catch(e){ clearInterval(scanPoll); return; }
      const total = s.total || 0;
      const done = (s.records || []).length;
      document.getElementById("scan-progress").max = Math.max(total, 1);
      document.getElementById("scan-progress").value = done;
      document.getElementById("scan-count").textContent = done + " / " + total;
      if (s.done){
        clearInterval(scanPoll);
        document.getElementById("scan-count").textContent += "  — scan complete";
      }
    }, 250);
  }

  document.getElementById("scan-btn").addEventListener("click", startScan);

  // ---------------------------------------------------------------------
  // 2. PLAN (centerpiece)
  // ---------------------------------------------------------------------
  let lastUndoLog = null;

  function renderPlan(plans){
    const list = document.getElementById("plan-list");
    list.innerHTML = '<div class="plan-row plan-head"><div>Old name</div><div>Reason</div><div>New path</div></div>';
    plans.forEach(p => {
      const row = document.createElement("div");
      row.className = "plan-row" + (/quarantined/i.test(p.reason || "") ? " err" : "");
      row.innerHTML =
        `<div class="old">${esc(p.old_path)}</div>` +
        `<div class="reason">${esc(p.reason)}</div>` +
        `<div class="new">${esc(p.new_path)}</div>`;
      list.appendChild(row);
    });
    document.getElementById("apply-btn").disabled = plans.length === 0;
  }

  async function buildPlan(){
    document.getElementById("plan-status").textContent = "building…";
    let data;
    try { data = await api("POST", "/api/plan", {}); }
    catch(e){ document.getElementById("plan-status").textContent = "failed"; return; }
    renderPlan(data.plans || []);
    document.getElementById("plan-status").textContent = data.plans.length + " changes proposed";
  }

  async function applyPlan(){
    document.getElementById("plan-status").textContent = "applying…";
    let data;
    try { data = await api("POST", "/api/apply", { dry_run: false }); }
    catch(e){ document.getElementById("plan-status").textContent = "apply failed"; return; }
    lastUndoLog = data.undo_log;
    document.getElementById("plan-status").textContent = "applied — " + data.moved + " moved";
    document.getElementById("apply-btn").disabled = true;
    document.getElementById("undo-btn").style.display = "inline-block";
  }

  async function undoPlan(){
    document.getElementById("plan-status").textContent = "undoing…";
    let data;
    try { data = await api("POST", "/api/undo", { log: lastUndoLog }); }
    catch(e){ document.getElementById("plan-status").textContent = "undo failed"; return; }
    document.getElementById("plan-status").textContent = "restored " + data.restored + " files";
    document.getElementById("undo-btn").style.display = "none";
    document.getElementById("apply-btn").disabled = false;
  }

  document.getElementById("plan-btn").addEventListener("click", buildPlan);
  document.getElementById("apply-btn").addEventListener("click", applyPlan);
  document.getElementById("undo-btn").addEventListener("click", undoPlan);

  // ---------------------------------------------------------------------
  // 3. SEARCH
  // ---------------------------------------------------------------------
  let activeFamily = null;
  let activeType = null; // "oneshot" | "loop" | null

  function buildChips(){
    const fam = document.getElementById("family-chips");
    fam.innerHTML = FAMILIES.map(f => `<span class="chip" data-family="${esc(f)}">${esc(f)}</span>`).join("");
    fam.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      const f = chip.dataset.family;
      activeFamily = (activeFamily === f) ? null : f;
      fam.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.family === activeFamily));
      runSearch();
    }));

    const type = document.getElementById("type-chips");
    type.innerHTML = ["oneshot", "loop"].map(t => `<span class="chip" data-type="${t}">${t}</span>`).join("");
    type.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
      const t = chip.dataset.type;
      activeType = (activeType === t) ? null : t;
      type.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.type === activeType));
      runSearch();
    }));
  }

  function renderHits(container, hits){
    container.innerHTML = "";
    if (!hits.length){
      container.innerHTML = '<div class="muted" style="padding:10px;">no results</div>';
      return;
    }
    hits.forEach(h => {
      const r = h.record || {};
      const row = document.createElement("div");
      row.className = "hit-row";
      row.innerHTML =
        `<button class="play-btn" title="play">&#9658;</button>` +
        `<span class="hit-name">${esc(r.filename)}</span>` +
        `<span class="hit-meta">${esc(r.family)} / ${esc(r.instrument)}</span>` +
        `<span class="hit-meta">${r.bpm ? esc(r.bpm) + " BPM" : "—"} · ${esc(r.key || "—")}</span>` +
        `<span class="score-bar"><span style="width:${Math.round((h.score||0)*100)}%"></span></span>` +
        `<span>${reasonChips(h.reasons)}</span>` +
        (r.error ? `<span class="chip reason" style="color:var(--bad);border-color:var(--bad);">${esc(r.error)}</span>` : "");
      row.querySelector(".play-btn").addEventListener("click", () => playAudio(r.path, r.filename));
      container.appendChild(row);
    });
  }

  async function runSearch(){
    const body = {
      text: document.getElementById("search-text").value.trim() || null,
      family: activeFamily,
      sample_type: activeType,
      bpm_min: numOrNull(document.getElementById("bpm-min").value),
      bpm_max: numOrNull(document.getElementById("bpm-max").value),
      limit: 50,
    };
    let data;
    try { data = await api("POST", "/api/search", body); } catch(e){ return; }
    renderHits(document.getElementById("search-results"), data.hits || []);
  }

  function numOrNull(v){ return (v === "" || v === null || v === undefined) ? null : Number(v); }

  document.getElementById("search-btn").addEventListener("click", runSearch);
  document.getElementById("search-text").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });
  document.getElementById("bpm-min").addEventListener("change", runSearch);
  document.getElementById("bpm-max").addEventListener("change", runSearch);
  document.getElementById("search-clear").addEventListener("click", () => {
    activeFamily = null; activeType = null;
    document.getElementById("search-text").value = "";
    document.getElementById("bpm-min").value = "";
    document.getElementById("bpm-max").value = "";
    document.querySelectorAll("#family-chips .chip, #type-chips .chip").forEach(c => c.classList.remove("active"));
    runSearch();
  });

  // ---------------------------------------------------------------------
  // 4. FIT
  // ---------------------------------------------------------------------
  let lastFitFile = null;
  let contrastOn = false;

  const dropZone = document.getElementById("drop-zone");
  const fitInput = document.getElementById("fit-file-input");

  ["dragenter", "dragover"].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.add("drag");
  }));
  ["dragleave", "drop"].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.remove("drag");
  }));
  dropZone.addEventListener("drop", e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f){ lastFitFile = f; doFit(); }
  });
  dropZone.addEventListener("click", () => fitInput.click());
  fitInput.addEventListener("change", () => {
    if (fitInput.files[0]){ lastFitFile = fitInput.files[0]; doFit(); }
  });

  document.getElementById("contrast-toggle").addEventListener("click", (e) => {
    contrastOn = !contrastOn;
    e.currentTarget.textContent = "Contrast: " + (contrastOn ? "ON" : "OFF");
    e.currentTarget.classList.toggle("active", contrastOn);
    if (lastFitFile) doFit();
  });

  async function doFit(){
    if (!lastFitFile) return;
    const container = document.getElementById("fit-results");
    container.innerHTML = '<div class="muted" style="padding:10px;">analysing…</div>';
    const form = new FormData();
    form.append("file", lastFitFile, lastFitFile.name);
    form.append("contrast", contrastOn ? "true" : "false");
    let data;
    try { data = await api("POST", "/api/fit?contrast=" + contrastOn, form); }
    catch(e){ container.innerHTML = ""; return; }
    renderHits(container, data.hits || []);
  }

  // ---------------------------------------------------------------------
  buildChips();
  loadStatus();
  runSearch();
})();
</script>
</body>
</html>
